<header class="md:hidden p-4 border-b border-gray-900 flex justify-between items-center bg-[#0a0a0a]">
  <span class="font-bold font-mono text-lg shrink-0" [class]="themeStore.themeColor().text">DEV_PORTAL</span>
  <app-language-switcher />
  <div class="flex space-x-2 overflow-x-auto scrollbar-hide">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.path === '/' }"
         #rla="routerLinkActive"
         class="p-2 rounded hover:bg-white/5 cursor-pointer shrink-0"
         [class]="rla.isActive ? themeStore.themeColor().text : 'text-gray-400'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
      </a>
    }
  </div>
</header>
