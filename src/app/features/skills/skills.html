<section class="max-w-4xl space-y-10 animate-fadeIn">
  <div>
    <h2 class="text-3xl font-extrabold text-white mb-2">{{ 'skills.title' | transloco }}</h2>
    <p class="text-gray-400 text-sm font-mono">{{ 'skills.subtitle' | transloco }}</p>
  </div>

  <div class="grid md:grid-cols-2 gap-8">
    @for (group of groups; track group.labelKey) {
      <div>
        <h3 class="text-xs font-mono text-gray-500 uppercase tracking-widest mb-4">
          {{ group.labelKey | transloco }}
        </h3>
        <div class="flex flex-wrap gap-2.5">
          @for (item of group.items; track item) {
            <span class="px-3 py-1.5 rounded-lg text-xs font-mono border"
                  [class]="chipClasses[group.accent]">
              {{ item }}
            </span>
          }
        </div>
      </div>
    }
  </div>
</section>
