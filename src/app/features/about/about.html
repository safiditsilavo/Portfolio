<section class="max-w-3xl space-y-12 animate-fadeIn">
  <div class="border-l-4 pl-6" [class]="themeStore.themeColor().border">
    <h2 class="text-3xl font-extrabold text-white mb-4 tracking-tight">{{ 'about.title' | transloco }}</h2>
    <p class="text-gray-400 text-lg leading-relaxed">{{ 'about.bio' | transloco }}</p>
  </div>

  <div class="space-y-6">
    <h3 class="text-xl font-mono flex items-center" [class]="themeStore.themeColor().text">
      <span class="mr-2">#</span> {{ 'about.experience.heading' | transloco }}
    </h3>
    <div class="relative border-l border-gray-900 ml-3 space-y-8 pl-8 pb-4">
      @for (entry of experiences; track entry.titleKey) {
        <app-timeline-item [entry]="entry" />
      }
    </div>
  </div>

  <div class="space-y-6">
    <h3 class="text-xl font-mono flex items-center" [class]="themeStore.themeColor().text">
      <span class="mr-2">#</span> {{ 'about.education.heading' | transloco }}
    </h3>
    <div class="relative border-l border-gray-900 ml-3 space-y-8 pl-8 pb-4">
      @for (entry of education; track entry.titleKey) {
        <app-timeline-item [entry]="entry" />
      }
    </div>
  </div>
</section>
